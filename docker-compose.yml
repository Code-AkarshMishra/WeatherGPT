version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: weathergpt-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: weathergpt

  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: weathergpt-server
    ports:
      - '5001:5001'
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/weathergpt
    depends_on:
      - mongodb
    volumes:
      - ./server/logs:/app/logs

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: weathergpt-client
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
